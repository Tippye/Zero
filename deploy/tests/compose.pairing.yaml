# Isolated synthetic acceptance stack. No production env file or mailbox is used.
name: zero-pairing-test
x-env: &env
  DATABASE_URL: postgresql://zero:synthetic-pairing-test@db:5432/zero
  PUBLIC_URL: http://localhost:19180
  AUTH_ORIGINS: http://localhost:19180,https://localhost:19143
  BETTER_AUTH_SECRET: synthetic-pairing-tests-only-32-bytes-secret
  REDIS_URL: http://redis-http:80
  REDIS_TOKEN: synthetic-redis-token
  IMAP_BRIDGE_URL: http://unused-bridge:3033
  IMAP_BRIDGE_SECRET: synthetic-unused-bridge
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: zero
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: synthetic-pairing-test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zero -d zero']
      interval: 2s
      retries: 30
  redis:
    image: valkey/valkey:8.1-alpine
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: env
      SRH_TOKEN: synthetic-redis-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on: [redis]
  migrate:
    build: { context: ../.., dockerfile: deploy/tests/Dockerfile.pairing }
    image: zero-pairing-runtime:test
    environment: *env
    command: [node, migrate.mjs]
    depends_on:
      db: { condition: service_healthy }
  api:
    image: zero-pairing-runtime:test
    environment: *env
    volumes:
      - ${ZERO_PAIRING_WORKER:-/tmp/zero-pairing-worker}:/app/worker:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-http: { condition: service_started }
  web:
    image: nginx:alpine
    ports: ['127.0.0.1:19180:80']
    volumes:
      - ../../apps/mail/build/client:/usr/share/nginx/html:ro
      - ../nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
