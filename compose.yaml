name: zero
x-api-env: &api-env
  SELF_HOSTED: 'true'
  DATABASE_URL: postgresql://zero:${POSTGRES_PASSWORD:?Run node deploy/init.mjs}@db:5432/zero
  PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in deploy/.env}
  AUTH_ORIGINS: ${AUTH_ORIGINS:-${PUBLIC_URL}}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Required}
  REDIS_URL: http://redis-http:80
  REDIS_TOKEN: ${REDIS_TOKEN:?Required}
  IMAP_BRIDGE_URL: http://imap-bridge:3033
  IMAP_BRIDGE_SECRET: ${BRIDGE_SECRET:?Required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  LLM_LOOPBACK_HOST: ${LLM_LOOPBACK_HOST-host.docker.internal}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL:-}
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: zero
      POSTGRES_DB: zero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zero -d zero']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: [valkey-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-http:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_TOKEN:?Required}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
  imap-bridge:
    build: integrations/imap-bridge
    init: true
    restart: unless-stopped
    environment:
      BRIDGE_SECRET: ${BRIDGE_SECRET:?Required}
      BRIDGE_ENCRYPTION_KEY: ${BRIDGE_ENCRYPTION_KEY:?Required}
      BRIDGE_ALLOWED_MAIL_HOSTS: ${BRIDGE_ALLOWED_MAIL_HOSTS:-}
      BRIDGE_DATA_DIR: /data
    volumes: [bridge-data:/data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3033/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: ., dockerfile: deploy/Dockerfile, target: api }
    image: zero-api:local
    command: [node, migrate.mjs]
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PAIRING_OWNER_ID: ${PAIRING_OWNER_ID:-}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  api:
    image: zero-api:local
    build: { context: ., dockerfile: deploy/Dockerfile, target: api }
    init: true
    restart: unless-stopped
    environment: *api-env
    volumes: [worker-data:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      imap-bridge: { condition: service_healthy }
      redis-http: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mail-sync:
    build: { context: ., dockerfile: deploy/Dockerfile, target: sync }
    init: true
    restart: unless-stopped
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "import postgres from 'postgres';const sql=postgres(process.env.DATABASE_URL);const [r]=await sql`SELECT heartbeat_at>now()-interval '60 seconds' AS ok FROM mail0_sync_worker_health WHERE id=1`;await sql.end();process.exit(r?.ok?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: { context: ., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  redis-data:
  bridge-data:
  worker-data:
