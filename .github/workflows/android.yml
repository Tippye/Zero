name: Android client
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/mobile/android/**'
      - 'native/mobile/scripts/**'
      - 'native/mobile/package.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm test --prefix native/mobile
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
        working-directory: native/mobile/android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: native/mobile/android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zero-Mail-Android-debug
          path: |
            native/mobile/android/app/build/outputs/apk/debug/*.apk
            native/mobile/android/app/build/reports/
            native/mobile/android/app/build/outputs/androidTest-results/
