name: Apple native applications
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'native/apple/**',
        'apps/server/src/lib/native-mail*',
        'apps/server/src/routes/native.ts',
        '.github/workflows/apple-auth.yml',
      ]
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test shared mail, authentication and Keychain
        working-directory: native/apple
        run: swift test
      - name: Build native Mac application
        working-directory: native/apple
        run: xcodebuild -project ZeroMail.xcodeproj -scheme ZeroMac -destination 'platform=macOS' -derivedDataPath /tmp/zero-mac CODE_SIGNING_ALLOWED=NO build
      - name: Build universal iPhone and iPad application
        working-directory: native/apple
        run: xcodebuild -project ZeroMail.xcodeproj -scheme ZeroIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/zero-ios CODE_SIGNING_ALLOWED=NO build
      - name: Build independent Apple Watch application
        working-directory: native/apple
        run: xcodebuild -project ZeroMail.xcodeproj -scheme ZeroWatch -destination 'generic/platform=watchOS Simulator' -derivedDataPath /tmp/zero-watch CODE_SIGNING_ALLOWED=NO build
      - name: Select installed iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phone = next(d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ZERO_SIMULATOR=' + phone['udid'] + '\n')
          PY
      - name: Test iPhone onboarding
        working-directory: native/apple
        run: xcodebuild -project ZeroMail.xcodeproj -scheme ZeroIOS -destination "platform=iOS Simulator,id=$ZERO_SIMULATOR" -derivedDataPath /tmp/zero-ios -resultBundlePath /tmp/zero-ios-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-simulator-results
          path: /tmp/zero-ios-tests.xcresult
          if-no-files-found: ignore
